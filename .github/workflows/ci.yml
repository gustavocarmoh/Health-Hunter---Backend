name: CI

# Roda em todo push e em Pull Requests para main/develop
on:
  push:
    branches-ignore:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
      - develop

# Cancela execuções anteriores do mesmo PR/branch para economizar minutos
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '25'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint (zero warnings permitidas)
        run: npm run lint:check

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '25'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:cov

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  build-image:
    name: Build Docker Image (validação)
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Apenas constrói a imagem para validar o Dockerfile (sem push)
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: health-hunter-bff:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
