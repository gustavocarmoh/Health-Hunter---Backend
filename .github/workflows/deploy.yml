name: Deploy to AWS EC2 (Free Tier)

# ════════════════════════════════════════════════════════════════════════════
# FLUXO DE DEPLOY COM APROVAÇÃO OBRIGATÓRIA
# ════════════════════════════════════════════════════════════════════════════
#
# Trigger: Push em branch rc/* (release candidate)
# 
# Fluxo automático:
#   1. CI (Lint + Tests)
#   2. Build & Push imagem para ECR
#   3. ⏸ AGUARDA APROVAÇÃO MANUAL (bloqueia aqui até reviewer aprovar)
#   4. Deploy em EC2 (SOMENTE após aprovação)
#
# Se nenhum reviewer aprovar dentro do tempo limite:
#   - CI e Build continuam executados
#   - Deploy NÃO executa
#   - Código fica em rc/* aguardando ação
#
# CONFIGURAÇÃO NO GITHUB (OBRIGATÓRIA):
# ────────────────────────────────────────────────────────────────────────────
# 1. Ir em: Settings > Environments > New environment
# 2. Nome: "production-gate"
# 3. Em "Required reviewers" → selecionar usuários que podem aprovar
# 4. Exemplo: 2-3 tech leads que precisam aprovar antes de deploy
#
# COMO USAR:
# ────────────────────────────────────────────────────────────────────────────
# $ git push origin rc/1.0.0
#   → GitHub Actions dispara CI/Build automaticamente
#   → Workflow aguarda aprovação no painel do repositório
#   → Reviewer clica "Review deployments" e aprova/rejeita
#   → Se aprovado: Deploy executa
#   → Se rejeitado: Deploy não executa
#
# ════════════════════════════════════════════════════════════════════════════

# Dispara em push para branches com padrão rc/* (release candidate)
# Exemplo: rc/1.0.0, rc/2.1.0
# Fluxo: CI → Build & Push → Aguarda Aprovação Manual → Deploy
on:
  push:
    branches:
      - 'rc/*'

# Garante que apenas um deploy rode por vez para a mesma branch
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false   # não cancela: espera o deploy anterior terminar

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # 1. CI — garante que o código está válido antes de qualquer push para ECR
  # ──────────────────────────────────────────────────────────────────────────
  ci:
    name: Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '25'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:check

      - name: Tests
        run: npm run test -- --passWithNoTests --forceExit

  # ──────────────────────────────────────────────────────────────────────────
  # 2. Build & Push — constrói a imagem Docker e envia para o ECR
  # ──────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    needs: ci
    outputs:
      image: ${{ steps.build-push.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Tags: commit SHA (imutável para rollback) + latest (convenção)
      - name: Build, tag and push image to ECR
        id: build-push
        uses: docker/build-push-action@v6
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          context: .
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Exporta o digest para uso no output
          outputs: type=image,name=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }},push-by-digest=false

      - name: Set image output
        id: set-output
        run: |
          echo "image=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

    outputs:
      image: ${{ steps.set-output.outputs.image }}

  # ──────────────────────────────────────────────────────────────────────────
  # 3. Aprovação manual obrigatória — pausa o pipeline até um reviewer aprovar
  #    CONFIGURAÇÃO OBRIGATÓRIA NO GITHUB:
  #    1. Ir em: Settings > Environments > Criar/usar "production-gate"
  #    2. Em "Required reviewers" → adicionar usuários que podem aprovar deploy
  #    3. Deploy só executa após aprovação de um dos reviewers configurados
  #    Se nenhum reviewer aprovar, o deploy não roda (código fica em rc/*)
  # ──────────────────────────────────────────────────────────────────────────
  await-approval:
    name: ⏸ Aguardar aprovação manual para deploy
    runs-on: ubuntu-latest
    needs: build-and-push
    environment:
      name: production-gate   # REQUER configuração em GitHub (Settings > Environments)

    steps:
      - name: Verificar aprovação
        run: |
          echo "✅ Aprovação concedida por um reviewer!"
          echo ""
          echo "Deploy será enviado para produção em seguida..."
          echo ""
          echo "Detalhes:"
          echo "  Branch: ${{ github.ref }}"
          echo "  Commit: ${{ github.sha }}"
          echo "  Autor: ${{ github.actor }}"

  # ──────────────────────────────────────────────────────────────────────────
  # 4. Deploy em produção — EXECUTA APENAS APÓS APROVAÇÃO do job anterior
  #    Envia SSM Run Command para o EC2 executar /app/deploy.sh
  #    Não requer SSH — usa IAM + SSM Agent (AmazonSSMManagedInstanceCore).
  #    EC2 puxa a imagem do ECR e reinicia apenas o container da app
  #    (Redis permanece rodando sem interrupção).
  # ──────────────────────────────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to EC2 (SOMENTE APÓS APROVAÇÃO)
    runs-on: ubuntu-latest
    needs: [build-and-push, await-approval]
    environment:
      name: production
      url: ${{ secrets.APP_URL }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Envia o comando de deploy para o EC2 via SSM (sem SSH key)
      - name: Send deploy command via SSM Run Command
        id: ssm
        run: |
          IMAGE="${{ needs.build-and-push.outputs.image }}"

          # Cria payload JSON para evitar problemas de quoting com a URL da imagem
          printf '{"commands":["bash /app/deploy.sh %s"]}' "$IMAGE" > /tmp/ssm-cmd.json

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${{ github.sha }}" \
            --timeout-seconds 300 \
            --parameters file:///tmp/ssm-cmd.json \
            --region "${{ env.AWS_REGION }}" \
            --query Command.CommandId \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "SSM Command ID: $COMMAND_ID"

      # Aguarda conclusão e verifica resultado (polling a cada 10 s, máx 5 min)
      - name: Wait for deploy to complete
        run: |
          COMMAND_ID="${{ steps.ssm.outputs.command_id }}"
          EC2_ID="${{ secrets.EC2_INSTANCE_ID }}"
          REGION="${{ env.AWS_REGION }}"
          MAX_POLLS=30   # 30 × 10 s = 5 min

          for i in $(seq 1 $MAX_POLLS); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_ID" \
              --region "$REGION" \
              --query StatusDetails \
              --output text 2>/dev/null || echo "Pending")

            echo "($i/$MAX_POLLS) Status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "Deploy concluído com sucesso."
              exit 0
            fi

            if [[ "$STATUS" == "Failed" || "$STATUS" == "Cancelled" || "$STATUS" == "TimedOut" ]]; then
              echo "--- Saída de erro do EC2 ---"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$EC2_ID" \
                --region "$REGION" \
                --query StandardErrorContent \
                --output text || true
              echo "--- Saída padrão do EC2 ---"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$EC2_ID" \
                --region "$REGION" \
                --query StandardOutputContent \
                --output text || true
              exit 1
            fi
          done

          echo "Timeout: deploy não concluiu em 5 minutos."
          exit 1

      - name: Print deploy summary
        run: |
          echo "### Deploy EC2 concluído com sucesso" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Campo | Valor |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Instância | \`${{ secrets.EC2_INSTANCE_ID }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Imagem | \`${{ needs.build-and-push.outputs.image }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| URL | ${{ secrets.APP_URL }} |" >> "$GITHUB_STEP_SUMMARY"
