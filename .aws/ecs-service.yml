# ╔══════════════════════════════════════════════════════════════════════╗
# ║  DEPRECATED — Infraestrutura migrada para EC2 Free Tier             ║
# ║                                                                      ║
# ║  Este arquivo foi o template CloudFormation para ECS Fargate.       ║
# ║  A partir de agora a infraestrutura usa EC2 t2.micro (free tier).   ║
# ║                                                                      ║
# ║  Novo template: .aws/ec2-infra.yml                                  ║
# ║  Novo pipeline: .github/workflows/deploy.yml (SSM Run Command)      ║
# ╚══════════════════════════════════════════════════════════════════════╝
#
# Por que EC2 e não Fargate?
#   - ECS Fargate NÃO é gratuito (cobrado por vCPU-segundo).
#   - EC2 t2.micro tem 750 h/mês GRÁTIS por 12 meses (Free Tier).
#   - ElastiCache (Redis gerenciado) também NÃO é gratuito;
#     Redis agora roda como container Docker no mesmo EC2.
#   - ALB NÃO é gratuito (~$16/mês); acesso direto via Elastic IP.
#   - Secrets Manager NÃO é gratuito após 30 dias;
#     substituído por SSM Parameter Store Standard (gratuito).
#
# Consulte .aws/ec2-infra.yml para a configuração atual.

  Configurado com a menor instância Fargate possível: 0.25 vCPU + 512 MB.
  Máximo de 1 task — auto scaling desativado.
  Este template gerencia apenas a camada de compute — banco e cache são
  provisionados separadamente (RDS + ElastiCache).

# ─────────────────────────────────────────────────────────────────────────────
# Parâmetros — substituídos pelo pipeline ou manualmente no deploy inicial
# ─────────────────────────────────────────────────────────────────────────────
Parameters:
  ECSClusterName:
    Type: String
    Description: Nome do cluster ECS existente

  ECSServiceName:
    Type: String
    Default: health-hunter-bff
    Description: Nome do serviço ECS

  TaskDefinitionArn:
    Type: String
    Description: ARN completo da task definition (ex: arn:aws:ecs:...:task-definition/health-hunter-bff:42)

  VpcSubnets:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Subnets privadas onde os containers vão rodar

  SecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group do serviço ECS

  TargetGroupArn:
    Type: String
    Description: ARN do Target Group do ALB para o serviço

  # ── Capacidade (Free Tier: fixo em 1 task) ──────────────────────────────────────
  MinTasks:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 1
    Description: "Free Tier: fixo em 1 task"

  MaxTasks:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 1
    Description: "Free Tier: máximo de 1 task — auto scaling efetivamente desativado"

  DesiredTasks:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 1
    Description: "Free Tier: sempre 1 task rodando"

  # ── Thresholds de escalabilidade (preservados para referência futura) ───────────
  ScaleOutCpuThreshold:
    Type: Number
    Default: 70
    Description: "% CPU que dispara scale-out"

  ScaleInCpuThreshold:
    Type: Number
    Default: 30
    Description: "% CPU que dispara scale-in"

  ScaleOutMemThreshold:
    Type: Number
    Default: 75
    Description: "% Memória que dispara scale-out"

# ─────────────────────────────────────────────────────────────────────────────
# Recursos
# ─────────────────────────────────────────────────────────────────────────────
Resources:

  # ── ECS Service ─────────────────────────────────────────────────────────────
  ECSService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Ref ECSServiceName
      Cluster: !Ref ECSClusterName
      TaskDefinition: !Ref TaskDefinitionArn
      DesiredCount: !Ref DesiredTasks   # sempre 1 no free tier
      LaunchType: FARGATE

      # Rolling update: nunca deixa o serviço abaixo de 100% de capacidade
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true       # Para o deploy automaticamente se as tasks falharem
          Rollback: true     # Faz rollback para a versão anterior

      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED   # Tasks em subnet privada — acesso via ALB
          Subnets: !Ref VpcSubnets
          SecurityGroups:
            - !Ref SecurityGroupId

      LoadBalancers:
        - ContainerName: health-hunter-bff
          ContainerPort: 3000
          TargetGroupArn: !Ref TargetGroupArn

      EnableExecuteCommand: true   # Permite `aws ecs execute-command` para debug

  # ── Application Auto Scaling: registra o serviço ECS como alvo escalável ───
  AutoScalingTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    DependsOn: ECSService
    Properties:
      MinCapacity: !Ref MinTasks
      MaxCapacity: !Ref MaxTasks
      ResourceId: !Sub service/${ECSClusterName}/${ECSServiceName}
      ScalableDimension: ecs:service:DesiredCount
      ServiceNamespace: ecs
      RoleARN: !Sub arn:aws:iam::${AWS::AccountId}:role/aws-service-role/ecs.application-autoscaling.amazonaws.com/AWSServiceRoleForApplicationAutoScaling_ECSService

  # ── Scale-out por CPU ────────────────────────────────────────────────────────
  ScaleOutCpuPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: health-hunter-bff-scale-out-cpu
      PolicyType: StepScaling
      ScalingTargetId: !Ref AutoScalingTarget
      StepScalingPolicyConfiguration:
        AdjustmentType: ChangeInCapacity
        Cooldown: 60           # segundos entre scale-outs consecutivos
        MetricAggregationType: Average
        StepAdjustments:
          - MetricIntervalLowerBound: 0    # CPU entre threshold e +15%
            MetricIntervalUpperBound: 15
            ScalingAdjustment: 1           # adiciona 1 task
          - MetricIntervalLowerBound: 15   # CPU acima de threshold +15%
            ScalingAdjustment: 2           # adiciona 2 tasks (pico abrupto)

  ScaleOutCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: health-hunter-bff-cpu-high
      AlarmDescription: !Sub "CPU média acima de ${ScaleOutCpuThreshold}% — escala horizontalmente"
      Namespace: AWS/ECS
      MetricName: CPUUtilization
      Dimensions:
        - Name: ClusterName
          Value: !Ref ECSClusterName
        - Name: ServiceName
          Value: !Ref ECSServiceName
      Statistic: Average
      Period: 60              # janela de 60s
      EvaluationPeriods: 2    # 2 períodos consecutivos antes de escalar
      Threshold: !Ref ScaleOutCpuThreshold
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Ref ScaleOutCpuPolicy

  # ── Scale-in por CPU ─────────────────────────────────────────────────────────
  ScaleInCpuPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: health-hunter-bff-scale-in-cpu
      PolicyType: StepScaling
      ScalingTargetId: !Ref AutoScalingTarget
      StepScalingPolicyConfiguration:
        AdjustmentType: ChangeInCapacity
        Cooldown: 300          # 5 min antes de escalar para baixo (mais conservador)
        MetricAggregationType: Average
        StepAdjustments:
          - MetricIntervalUpperBound: 0   # CPU abaixo do threshold
            ScalingAdjustment: -1         # remove 1 task por vez

  ScaleInCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: health-hunter-bff-cpu-low
      AlarmDescription: !Sub "CPU média abaixo de ${ScaleInCpuThreshold}% — reduz tasks"
      Namespace: AWS/ECS
      MetricName: CPUUtilization
      Dimensions:
        - Name: ClusterName
          Value: !Ref ECSClusterName
        - Name: ServiceName
          Value: !Ref ECSServiceName
      Statistic: Average
      Period: 60
      EvaluationPeriods: 5    # aguarda 5 min antes de scale-in (evita flapping)
      Threshold: !Ref ScaleInCpuThreshold
      ComparisonOperator: LessThanOrEqualToThreshold
      AlarmActions:
        - !Ref ScaleInCpuPolicy

  # ── Scale-out por Memória ────────────────────────────────────────────────────
  ScaleOutMemPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: health-hunter-bff-scale-out-memory
      PolicyType: StepScaling
      ScalingTargetId: !Ref AutoScalingTarget
      StepScalingPolicyConfiguration:
        AdjustmentType: ChangeInCapacity
        Cooldown: 60
        MetricAggregationType: Average
        StepAdjustments:
          - MetricIntervalLowerBound: 0
            ScalingAdjustment: 1

  ScaleOutMemAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: health-hunter-bff-memory-high
      AlarmDescription: !Sub "Memória média acima de ${ScaleOutMemThreshold}% — escala horizontalmente"
      Namespace: AWS/ECS
      MetricName: MemoryUtilization
      Dimensions:
        - Name: ClusterName
          Value: !Ref ECSClusterName
        - Name: ServiceName
          Value: !Ref ECSServiceName
      Statistic: Average
      Period: 60
      EvaluationPeriods: 2
      Threshold: !Ref ScaleOutMemThreshold
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Ref ScaleOutMemPolicy

# ─────────────────────────────────────────────────────────────────────────────
# Outputs — usados pelo pipeline para referenciar recursos criados
# ─────────────────────────────────────────────────────────────────────────────
Outputs:
  ECSServiceArn:
    Description: ARN do serviço ECS
    Value: !Ref ECSService
    Export:
      Name: !Sub ${AWS::StackName}-ServiceArn

  AutoScalingTargetId:
    Description: ID do alvo de auto scaling
    Value: !Sub service/${ECSClusterName}/${ECSServiceName}
