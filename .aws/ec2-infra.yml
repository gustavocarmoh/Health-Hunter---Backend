AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Health Hunter BFF — infraestrutura 100% free tier da AWS (12 meses).

  ┌─ Free Tier ──────────────────────────────────────────────────────────┐
  │ EC2 t2.micro        750 h/mês • 1 vCPU • 1 GB RAM                   │
  │ RDS db.t3.micro     750 h/mês • 20 GB SSD • Single-AZ               │
  │ EBS gp2             30 GB total disponíveis (usamos 20 GB root)      │
  │ ECR                 500 MB/mês de armazenamento de imagens           │
  │ CloudWatch Logs     5 GB ingestão + 5 GB armazenamento              │
  │ SSM Parameter Store parâmetros Standard gratuitos                    │
  │ Elastic IP          gratuito enquanto associado a EC2 rodando        │
  └──────────────────────────────────────────────────────────────────────┘

  ⚠  Redis roda no mesmo EC2 como container Docker (não ElastiCache — pago).
  ⚠  Sem ALB — acesso direto ao EC2 via Elastic IP (HTTPS opcional via nginx, ver abaixo).
  ⚠  Free tier válido por 12 meses após criação da conta AWS.

  HTTPS (opcional, grátis): informe os parâmetros DomainName + LetsEncryptEmail
  para provisionar nginx + certificado Let's Encrypt automaticamente no primeiro
  boot do EC2 (requer que o domínio já resolva para o Elastic IP deste stack
  ANTES do deploy). Sem esses parâmetros, a API continua em HTTP na porta 3000
  como hoje — nenhuma mudança de comportamento.

  Arquitetura:
    GitHub Actions → ECR → SSM Run Command → EC2 t2.micro
    EC2: nginx (HTTPS opcional) → Docker Compose (app NestJS + Redis) → RDS PostgreSQL (free tier)

# ─────────────────────────────────────────────────────────────────────────────
# Parâmetros
# ─────────────────────────────────────────────────────────────────────────────
Parameters:

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC onde os recursos serão criados (use a VPC padrão da conta)

  PublicSubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Subnet pública para o EC2 (deve ter rota para Internet Gateway)

  DBSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: >
      Duas subnets em AZs diferentes para o RDS (requisito da AWS).
      Podem ser as mesmas subnets públicas da VPC padrão.

  KeyPairName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Par de chaves SSH para acesso de emergência ao EC2

  AdminCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: >
      CIDR autorizado para SSH. Recomendado restringir ao seu IP: SEU_IP/32.
      0.0.0.0/0 aceita qualquer origem (menos seguro).
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'

  ECRRegistry:
    Type: String
    Description: "URL do registry ECR (ex: 123456789012.dkr.ecr.us-east-1.amazonaws.com)"

  ECRRepository:
    Type: String
    Default: health-hunter-bff
    Description: Nome do repositório ECR

  DBName:
    Type: String
    Default: healthhunter
    Description: Nome do banco de dados PostgreSQL
    AllowedPattern: '^[a-zA-Z][a-zA-Z0-9_]*$'

  DBUsername:
    Type: String
    Default: healthhunter
    Description: Usuário master do RDS (sem caracteres especiais)
    AllowedPattern: '^[a-zA-Z][a-zA-Z0-9_]*$'

  DBPassword:
    Type: String
    NoEcho: true
    MinLength: 12
    Description: >
      Senha master do RDS (mín. 12 caracteres, sem @ " / espaço).
      Após o deploy, salve também via:
        aws ssm put-parameter --name /health-hunter/prod/DB_PASSWORD --value "..." --type SecureString

  AllowedOrigins:
    Type: String
    Default: "https://app.healthhunter.com"
    Description: CORS origins permitidas (separadas por vírgula)

  AlertEmail:
    Type: String
    Default: ""
    Description: >
      E-mail para receber alarmes do CloudWatch (erros 5xx e picos de rate-limit/429).
      Deixe em branco para criar o tópico SNS sem assinatura automática — você pode
      assinar manualmente depois pelo console.

  DomainName:
    Type: String
    Default: ""
    Description: >
      Domínio público apontando (registro A) para o Elastic IP deste stack, usado para
      emitir um certificado HTTPS gratuito via Let's Encrypt (ex: api.healthhunter.com).
      Deixe em branco para continuar servindo só em HTTP na porta 3000 (comportamento
      atual) — o DNS precisa já estar resolvendo para o Elastic IP ANTES do primeiro
      boot do EC2, senão a emissão do certificado falha e o setup segue sem HTTPS.

  LetsEncryptEmail:
    Type: String
    Default: ""
    Description: >
      E-mail para avisos de expiração/renovação do Let's Encrypt. Obrigatório apenas
      se DomainName for informado.

# ─────────────────────────────────────────────────────────────────────────────
# Condições
# ─────────────────────────────────────────────────────────────────────────────
Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, ""]]

# ─────────────────────────────────────────────────────────────────────────────
# Recursos
# ─────────────────────────────────────────────────────────────────────────────
Resources:

  # ── Security Group: EC2 ──────────────────────────────────────────────────────
  EC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HTTP/HTTPS/app-port + SSH restrito para o EC2 do BFF
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP público (para futuro nginx)
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS público (para futuro certificado SSL)
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          CidrIp: 0.0.0.0/0
          Description: Porta do app NestJS
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AdminCidr
          Description: SSH de emergência (restringir ao seu IP em produção)
      Tags:
        - Key: Name
          Value: health-hunter-ec2-sg

  # ── Security Group: RDS ──────────────────────────────────────────────────────
  RDSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PostgreSQL acessível somente pelo EC2
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref EC2SecurityGroup
          Description: PostgreSQL — somente do EC2
      Tags:
        - Key: Name
          Value: health-hunter-rds-sg

  # ── RDS Subnet Group ─────────────────────────────────────────────────────────
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupName: health-hunter-db-subnet-group
      DBSubnetGroupDescription: Subnets para o RDS PostgreSQL (duas AZs)
      SubnetIds: !Ref DBSubnetIds
      Tags:
        - Key: Name
          Value: health-hunter-db-subnet-group

  # ── RDS db.t3.micro — Free Tier ──────────────────────────────────────────────
  # Free Tier: 750 h/mês por 12 meses + 20 GB SSD + 20 GB backup
  RDSInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot      # Cria snapshot antes de deletar (proteção de dados)
    Properties:
      DBInstanceIdentifier: health-hunter-db
      DBInstanceClass: db.t3.micro         # Free Tier: 2 vCPU, 1 GB RAM
      Engine: postgres
      EngineVersion: '16.3'
      DBName: !Ref DBName
      MasterUsername: !Ref DBUsername
      MasterUserPassword: !Ref DBPassword
      AllocatedStorage: '20'               # Free Tier: até 20 GB SSD
      StorageType: gp2
      MultiAZ: false                       # IMPORTANTE: Multi-AZ = pago. Single-AZ = free tier
      PubliclyAccessible: false            # Não expõe o banco na internet
      DBSubnetGroupName: !Ref DBSubnetGroup
      VPCSecurityGroups:
        - !Ref RDSSecurityGroup
      BackupRetentionPeriod: 7             # 7 dias de backup automático (gratuito no free tier)
      StorageEncrypted: true               # Criptografia em repouso
      DeletionProtection: false            # Desabilitar para facilitar teardown em dev
      Tags:
        - Key: Name
          Value: health-hunter-db

  # ── IAM Role: EC2 ────────────────────────────────────────────────────────────
  EC2IAMRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: health-hunter-ec2-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # SSM Agent + Run Command (deploy sem SSH) — gratuito
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        # CloudWatch Agent (métricas + logs) — gratuito no free tier
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
      Policies:
        - PolicyName: ecr-pull
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchCheckLayerAvailability
                Resource: '*'
        - PolicyName: ssm-params-read
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:GetParametersByPath
                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/health-hunter/*
              - Effect: Allow
                Action: kms:Decrypt
                # Chave gerenciada pela AWS para SecureString — sem custo adicional
                Resource: !Sub arn:aws:kms:${AWS::Region}:${AWS::AccountId}:key/aws/ssm

  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: health-hunter-ec2-profile
      Roles:
        - !Ref EC2IAMRole

  # ── SSM Parameters: String (gratuitos) ──────────────────────────────────────
  # SecureStrings (DB_PASSWORD, JWT_SECRET, etc.) são criados via CLI — veja Outputs.
  SSMParamDBHost:
    Type: AWS::SSM::Parameter
    DependsOn: RDSInstance
    Properties:
      Name: /health-hunter/prod/DB_HOST
      Type: String
      Value: !GetAtt RDSInstance.Endpoint.Address
      Description: Endpoint do RDS PostgreSQL (preenchido automaticamente)

  SSMParamDBPort:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /health-hunter/prod/DB_PORT
      Type: String
      Value: '5432'

  SSMParamDBName:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /health-hunter/prod/DB_DATABASE
      Type: String
      Value: !Ref DBName

  SSMParamDBUsername:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /health-hunter/prod/DB_USERNAME
      Type: String
      Value: !Ref DBUsername

  SSMParamAllowedOrigins:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /health-hunter/prod/ALLOWED_ORIGINS
      Type: String
      Value: !Ref AllowedOrigins

  # ── EC2 t2.micro — Free Tier ─────────────────────────────────────────────────
  EC2Instance:
    Type: AWS::EC2::Instance
    DependsOn: RDSInstance
    Properties:
      InstanceType: t2.micro                # Free Tier: 750 h/mês por 12 meses
      # AMI Amazon Linux 2023 — resolvida automaticamente por região via SSM
      ImageId: '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}'
      KeyName: !Ref KeyPairName
      IamInstanceProfile: !Ref EC2InstanceProfile
      SecurityGroupIds:
        - !Ref EC2SecurityGroup
      SubnetId: !Ref PublicSubnetId
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 20           # Free Tier: 30 GB EBS total — usamos 20 GB no root
            VolumeType: gp2
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: health-hunter-bff
      UserData:
        # Nota: ${AWS::Region} e ${ECRRegistry} são substituídos pelo CloudFormation (!Sub).
        # ${!VarName} → CloudFormation emite ${VarName} (sem substituição CF) → bash expande.
        # Arquivos criados com heredoc single-quoted (<< 'EOF') para evitar expansão bash
        # no momento da escrita — as variáveis são expandidas na execução dos scripts.
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          exec > >(tee /var/log/user-data.log | logger -t user-data -s 2>/dev/console) 2>&1

          echo "=== Health Hunter BFF — setup: $(date) ==="

          # Variáveis injetadas pelo CloudFormation no momento do deploy do stack
          REGION="${AWS::Region}"
          ECR_REGISTRY="${ECRRegistry}"
          ECR_REPOSITORY="${ECRRepository}"
          APP_DIR="/app"

          # ─── Atualizar sistema e instalar Docker ────────────────────────────
          dnf update -y
          dnf install -y docker amazon-ecr-credential-helper
          systemctl enable docker
          systemctl start docker
          usermod -aG docker ec2-user

          # ─── Docker Compose v2 ──────────────────────────────────────────────
          COMPOSE_VER="v2.27.1"
          curl -fsSL \
            "https://github.com/docker/compose/releases/download/$COMPOSE_VER/docker-compose-linux-x86_64" \
            -o /usr/local/bin/docker-compose
          chmod +x /usr/local/bin/docker-compose

          # ─── ECR Credential Helper para root ────────────────────────────────
          mkdir -p /root/.docker
          cat > /root/.docker/config.json << 'DOCKEREOF'
          {"credsStore": "ecr-login"}
          DOCKEREOF

          # ─── Diretório da aplicação ─────────────────────────────────────────
          mkdir -p "$APP_DIR"

          # ─── Escrever /app/deploy.sh ────────────────────────────────────────
          # Single-quoted heredoc: bash NÃO expande nada dentro.
          # CF já substituiu ${AWS::Region} e ${ECRRegistry} nas linhas sed abaixo.
          cat > "$APP_DIR/deploy.sh" << 'DEPLOYEOF'
          #!/bin/bash
          set -euo pipefail

          APP_IMAGE="${1:?Uso: deploy.sh <registro/repo:tag>}"
          REGION="__CF_REGION__"
          ECR_REGISTRY="__CF_ECR__"
          APP_DIR="/app"

          echo "=== Deploy: $APP_IMAGE | $(date) ==="

          # Busca parâmetro no SSM Parameter Store (com decriptação para SecureString)
          get_param() {
            aws ssm get-parameter \
              --name "/health-hunter/prod/$1" \
              --with-decryption \
              --region "$REGION" \
              --query Parameter.Value \
              --output text 2>/dev/null || echo ""
          }

          echo "Buscando parâmetros do SSM..."
          DB_HOST=$(get_param DB_HOST)
          DB_PORT=$(get_param DB_PORT)
          DB_DATABASE=$(get_param DB_DATABASE)
          DB_USERNAME=$(get_param DB_USERNAME)
          DB_PASSWORD=$(get_param DB_PASSWORD)
          REDIS_PASSWORD=$(get_param REDIS_PASSWORD)
          JWT_SECRET=$(get_param JWT_SECRET)
          JWT_REFRESH_SECRET=$(get_param JWT_REFRESH_SECRET)
          ALLOWED_ORIGINS=$(get_param ALLOWED_ORIGINS)
          GEMINI_API_KEY=$(get_param GEMINI_API_KEY)

          # Escreve .env.prod (env vars para o container app)
          # ATENÇÃO: chmod 600 protege credenciais em repouso
          cat > "$APP_DIR/.env.prod" << ENVEOF
          NODE_ENV=production
          PORT=3000
          DB_HOST=$DB_HOST
          DB_PORT=$DB_PORT
          DB_DATABASE=$DB_DATABASE
          DB_USERNAME=$DB_USERNAME
          DB_PASSWORD=$DB_PASSWORD
          DB_SSL=true
          REDIS_HOST=redis
          REDIS_PORT=6379
          REDIS_PASSWORD=$REDIS_PASSWORD
          JWT_SECRET=$JWT_SECRET
          JWT_REFRESH_SECRET=$JWT_REFRESH_SECRET
          JWT_EXPIRES_IN=15m
          JWT_REFRESH_EXPIRES_IN=7d
          ALLOWED_ORIGINS=$ALLOWED_ORIGINS
          GEMINI_API_KEY=$GEMINI_API_KEY
          GEMINI_MODEL=gemini-2.5-flash
          ENVEOF
          chmod 600 "$APP_DIR/.env.prod"

          # Docker Compose lê /app/.env para substituição de ${VAR} no compose file
          cp "$APP_DIR/.env.prod" "$APP_DIR/.env"
          echo "APP_IMAGE=$APP_IMAGE" >> "$APP_DIR/.env"

          # Autenticar no ECR
          aws ecr get-login-password --region "$REGION" | \
            docker login --username AWS --password-stdin "$ECR_REGISTRY"

          # Pull nova imagem e reiniciar apenas o container da app
          # (Redis continua rodando sem interrupção)
          cd "$APP_DIR"
          docker compose -f docker-compose.prod.yml pull app
          docker compose -f docker-compose.prod.yml up -d

          # Remover imagens antigas para liberar espaço (EC2 tem 20 GB)
          docker image prune -f

          echo "=== Deploy concluído: $APP_IMAGE ==="
          DEPLOYEOF

          chmod +x "$APP_DIR/deploy.sh"

          # Injetar valores do CloudFormation nos placeholders do deploy.sh
          sed -i "s|__CF_REGION__|$REGION|g"      "$APP_DIR/deploy.sh"
          sed -i "s|__CF_ECR__|$ECR_REGISTRY|g"   "$APP_DIR/deploy.sh"

          # ─── Escrever /app/docker-compose.prod.yml ──────────────────────────
          # ${!APP_IMAGE} → CF emite ${APP_IMAGE} → docker compose substitui do .env
          # ${!REDIS_PASSWORD} → CF emite ${REDIS_PASSWORD} → docker compose substitui
          # __CF_REGION__ → substituído pelo sed abaixo com o valor real da região
          cat > "$APP_DIR/docker-compose.prod.yml" << 'COMPOSEEOF'
          services:
            app:
              image: ${APP_IMAGE}
              restart: unless-stopped
              ports:
                - "3000:3000"
              env_file: /app/.env.prod
              depends_on:
                redis:
                  condition: service_healthy
              healthcheck:
                test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
                interval: 30s
                timeout: 5s
                retries: 3
                start_period: 20s
              logging:
                driver: awslogs
                options:
                  awslogs-region: __CF_REGION__
                  awslogs-group: /health-hunter/bff
                  awslogs-stream-prefix: app
                  awslogs-create-group: "true"
            redis:
              image: redis:7-alpine
              restart: unless-stopped
              command: >
                redis-server
                  --requirepass ${REDIS_PASSWORD}
                  --maxmemory 128mb
                  --maxmemory-policy allkeys-lru
                  --save 60 1
                  --loglevel warning
              volumes:
                - redis-data:/data
              healthcheck:
                test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping"]
                interval: 10s
                timeout: 3s
                retries: 5
          volumes:
            redis-data:
              driver: local
          COMPOSEEOF

          # Injetar região real no compose file
          sed -i "s|__CF_REGION__|$REGION|g" "$APP_DIR/docker-compose.prod.yml"

          # ─── Subir Redis imediatamente (não precisa da imagem do app) ───────
          # O container app só sobe após o primeiro deploy via GitHub Actions.
          echo "APP_IMAGE=placeholder" > "$APP_DIR/.env"
          echo "REDIS_PASSWORD=changeme_on_first_deploy" >> "$APP_DIR/.env"

          cd "$APP_DIR"
          docker compose -f docker-compose.prod.yml up -d redis

          # ─── HTTPS opcional (nginx + Let's Encrypt) ─────────────────────────
          # Só roda se o parâmetro DomainName foi informado no stack. Isolado num
          # bloco próprio com `|| echo ...` para que uma falha aqui (ex: DNS do
          # domínio ainda não propagado para o Elastic IP) NUNCA derrube o setup
          # de app/Redis feito acima — a API continua disponível em HTTP na 3000.
          DOMAIN_NAME="${DomainName}"
          LE_EMAIL="${LetsEncryptEmail}"

          if [ -n "$DOMAIN_NAME" ]; then
            echo "=== HTTPS: configurando nginx + Let's Encrypt para $DOMAIN_NAME ==="

            setup_https() {
              dnf install -y nginx
              # Certbot pode não estar no repo padrão do Amazon Linux 2023 dependendo
              # da região/data da AMI — instala via pip como alternativa robusta.
              dnf install -y certbot python3-certbot-nginx || pip3 install certbot certbot-nginx

              mkdir -p /var/www/certbot

              # Config inicial: só HTTP + rota do desafio ACME (necessária para o
              # certbot validar a posse do domínio antes de emitir o certificado).
              cat > /etc/nginx/conf.d/health-hunter.conf << 'NGINXEOF'
          server {
              listen 80;
              server_name __DOMAIN__;

              location /.well-known/acme-challenge/ {
                  root /var/www/certbot;
              }

              location / {
                  proxy_pass http://127.0.0.1:3000;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }
          NGINXEOF
              sed -i "s|__DOMAIN__|$DOMAIN_NAME|g" /etc/nginx/conf.d/health-hunter.conf

              systemctl enable nginx
              systemctl restart nginx

              certbot certonly --webroot -w /var/www/certbot \
                -d "$DOMAIN_NAME" \
                --non-interactive --agree-tos -m "$LE_EMAIL" --no-eff-email

              if [ -f "/etc/letsencrypt/live/$DOMAIN_NAME/fullchain.pem" ]; then
                # Certificado emitido: reescreve o vhost com redirect 80→443 + TLS.
                cat > /etc/nginx/conf.d/health-hunter.conf << 'NGINXEOF'
          server {
              listen 80;
              server_name __DOMAIN__;
              location /.well-known/acme-challenge/ { root /var/www/certbot; }
              location / { return 301 https://$host$request_uri; }
          }

          server {
              listen 443 ssl;
              server_name __DOMAIN__;

              ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
              ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;

              location / {
                  proxy_pass http://127.0.0.1:3000;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }
          NGINXEOF
                sed -i "s|__DOMAIN__|$DOMAIN_NAME|g" /etc/nginx/conf.d/health-hunter.conf
                systemctl reload nginx

                # Renovação automática (certbot expira em 90 dias) + reload do nginx
                echo "0 */12 * * * root certbot renew --quiet --deploy-hook 'systemctl reload nginx'" \
                  > /etc/cron.d/certbot-renew

                echo "=== HTTPS configurado com sucesso: https://$DOMAIN_NAME ==="
              else
                echo "=== AVISO: emissão do certificado falhou para $DOMAIN_NAME."
                echo "    Verifique se o DNS (registro A) já aponta para o Elastic IP deste stack"
                echo "    e rode manualmente via SSM depois:"
                echo "    certbot certonly --webroot -w /var/www/certbot -d $DOMAIN_NAME --agree-tos -m $LE_EMAIL"
                echo "    Aplicação segue disponível em HTTP na porta 3000. ==="
              fi
            }

            setup_https || echo "=== AVISO: configuração de HTTPS falhou — aplicação segue em HTTP na porta 3000, sem impacto no app/Redis. ==="
          else
            echo "=== HTTPS: parâmetro DomainName vazio — servindo apenas em HTTP na porta 3000 (comportamento atual). ==="
          fi

          echo "=== Setup concluído: $(date) ==="
          echo "=== Redis em execução. Aguardando primeiro deploy via GitHub Actions. ==="

  # ── CloudWatch Log Group — declarado aqui (não criado implicitamente pelo    ─
  #    driver awslogs do container) para poder anexar Metric Filters + retenção.
  #    14 dias de retenção evita consumir o free tier (5 GB) indefinidamente.
  AppLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /health-hunter/bff
      RetentionInDays: 14

  # ── SNS Topic para alarmes de segurança/operação ─────────────────────────────
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: health-hunter-alerts
      DisplayName: Health Hunter — Alertas

  AlertEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  # ── Métrica: erros de servidor (5xx) extraídos dos logs JSON estruturados ────
  # OWASP A09 — falha de log/monitoramento: sem isso, um pico de erros só é
  # percebido se alguém for olhar os logs manualmente.
  ServerErrorMetricFilter:
    Type: AWS::Logs::MetricFilter
    DependsOn: AppLogGroup
    Properties:
      LogGroupName: /health-hunter/bff
      FilterPattern: '{ $.res.statusCode >= 500 }'
      MetricTransformations:
        - MetricName: ServerErrorCount
          MetricNamespace: HealthHunter/BFF
          MetricValue: "1"
          DefaultValue: 0

  ServerErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: health-hunter-server-errors
      AlarmDescription: Mais de 10 respostas 5xx em 5 minutos — possível incidente em produção.
      Namespace: HealthHunter/BFF
      MetricName: ServerErrorCount
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic

  # ── Métrica: picos de 429 (rate limit) — possível força bruta/DoS ────────────
  RateLimitMetricFilter:
    Type: AWS::Logs::MetricFilter
    DependsOn: AppLogGroup
    Properties:
      LogGroupName: /health-hunter/bff
      FilterPattern: '{ $.res.statusCode = 429 }'
      MetricTransformations:
        - MetricName: RateLimitedCount
          MetricNamespace: HealthHunter/BFF
          MetricValue: "1"
          DefaultValue: 0

  RateLimitAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: health-hunter-rate-limit-spike
      AlarmDescription: >
        Mais de 50 respostas 429 em 5 minutos — possível força bruta em /auth/login
        ou abuso de algum endpoint.
      Namespace: HealthHunter/BFF
      MetricName: RateLimitedCount
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 50
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic

  # ── Elastic IP — endereço estático gratuito enquanto EC2 estiver rodando ─────
  ElasticIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: health-hunter-eip

  ElasticIPAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      InstanceId: !Ref EC2Instance
      EIP: !Ref ElasticIP

# ─────────────────────────────────────────────────────────────────────────────
# Outputs
# ─────────────────────────────────────────────────────────────────────────────
Outputs:

  PublicIP:
    Description: IP público estático do EC2 (Elastic IP)
    Value: !Ref ElasticIP
    Export:
      Name: !Sub ${AWS::StackName}-PublicIP

  AppURL:
    Description: URL da aplicação
    Value: !Sub http://${ElasticIP}:3000
    Export:
      Name: !Sub ${AWS::StackName}-AppURL

  EC2InstanceId:
    Description: >
      Instance ID do EC2.
      Copie este valor para o secret EC2_INSTANCE_ID no GitHub Actions.
    Value: !Ref EC2Instance
    Export:
      Name: !Sub ${AWS::StackName}-InstanceId

  RDSEndpoint:
    Description: Endpoint do banco de dados RDS PostgreSQL
    Value: !GetAtt RDSInstance.Endpoint.Address
    Export:
      Name: !Sub ${AWS::StackName}-RDSEndpoint

  AlertTopicArn:
    Description: >
      ARN do tópico SNS de alarmes. Se AlertEmail não foi informado no deploy,
      assine manualmente: aws sns subscribe --topic-arn <este-arn> --protocol email --notification-endpoint SEU_EMAIL
    Value: !Ref AlertTopic
    Export:
      Name: !Sub ${AWS::StackName}-AlertTopicArn

  NextSteps:
    Description: >
      Execute estes comandos ANTES do primeiro deploy para criar os parâmetros
      SecureString no SSM Parameter Store (DB_HOST já criado automaticamente).
    Value: !Sub |
      # Senha do banco (mesmo valor informado no parâmetro DBPassword do stack):
      aws ssm put-parameter --name /health-hunter/prod/DB_PASSWORD \
        --value "SUA_SENHA_DB" --type SecureString --region ${AWS::Region} --overwrite

      # Segredo JWT (gere: openssl rand -hex 32):
      aws ssm put-parameter --name /health-hunter/prod/JWT_SECRET \
        --value "SEU_JWT_SECRET_64CHARS" --type SecureString --region ${AWS::Region} --overwrite

      # Segredo JWT Refresh (gere: openssl rand -hex 32):
      aws ssm put-parameter --name /health-hunter/prod/JWT_REFRESH_SECRET \
        --value "SEU_REFRESH_SECRET_64CHARS" --type SecureString --region ${AWS::Region} --overwrite

      # Senha do Redis (gere: openssl rand -hex 16):
      aws ssm put-parameter --name /health-hunter/prod/REDIS_PASSWORD \
        --value "SUA_SENHA_REDIS_32CHARS" --type SecureString --region ${AWS::Region} --overwrite

      # Chave da API do Google Gemini (gratuita — gere em https://aistudio.google.com/apikey):
      aws ssm put-parameter --name /health-hunter/prod/GEMINI_API_KEY \
        --value "SUA_CHAVE_GEMINI" --type SecureString --region ${AWS::Region} --overwrite

      # Após criar os parâmetros, faça push na branch main para disparar o primeiro deploy.
